<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grana do casal</title>
<meta name="theme-color" content="#0F6B5C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F4FB;--card:#FFFFFF;--ink:#1E1B4B;--mute:#7A7FA3;--line:#E6E8F5;--acc:#4F3FD8;--accbg:#ECEAFE;--cy:#27C4E8;--pink:#F0457A;--pinkbg:#FDE6EE;--sh:0 8px 28px rgba(79,63,216,.09);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102B;--card:#1D1B44;--ink:#EEF0FF;--mute:#9A9FC9;--line:#2D2B5C;--acc:#9A8FFF;--accbg:#2B2866;--pinkbg:#3F1D3B;--sh:none}}
:root[data-theme="dark"]{--bg:#12102B;--card:#1D1B44;--ink:#EEF0FF;--mute:#9A9FC9;--line:#2D2B5C;--acc:#9A8FFF;--accbg:#2B2866;--pinkbg:#3F1D3B;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px 16px 8px}
.top{position:relative;color:#fff;border-radius:28px;padding:16px 18px 16px;background:linear-gradient(135deg,#3A2CB5 0%,#6B4DEB 100%);box-shadow:0 14px 34px rgba(79,63,216,.28)}
.top.bad{background:linear-gradient(135deg,#B8245C 0%,#F0457A 100%)}
.top small{opacity:.8;font-size:13px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eye{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.big{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:2px 0 4px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.row{display:flex;gap:12px;justify-content:space-between;font-size:13px}
.row b{display:block;font-size:16px}
.stats{padding:12px 0;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.accs{margin-top:12px;gap:8px;align-items:stretch}
.accs>div{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 10px}
.accs small{font-size:11px}
.accs b{font-size:14px}
.plus{width:48px;border-radius:16px;border:0;background:#fff;color:#4F3FD8;font-size:26px;font-weight:700;cursor:pointer;flex:none}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
button.p{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;cursor:pointer}
.edit{background:none;border:0;font:inherit;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.cal,.panel{background:var(--card);border-radius:24px;padding:16px;margin-top:16px;box-shadow:var(--sh)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px}
.nav h2{margin:0;font-size:18px;text-transform:capitalize}
.nav button{background:var(--accbg);border:0;color:var(--acc);border-radius:12px;width:40px;height:40px;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;font-weight:600;color:var(--mute);text-align:center;padding:2px 0}
.day{aspect-ratio:1/1.08;border:2px solid transparent;border-radius:14px;background:none;color:var(--ink);font:inherit;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}
.day span{font-size:14px;font-weight:600}
.day i{font-style:normal;font-size:9px;color:var(--mute);min-height:11px}
.day.has{background:var(--accbg)}
.day.has i{color:var(--acc);font-weight:700}
.day.over{background:var(--pinkbg)}
.day.over i{color:var(--pink);font-weight:700}
.day.split{border:2px dashed var(--cy)}
.day.today{border:2px solid var(--acc)}
.day.sel{background:var(--acc);border-color:var(--acc)}
.day.sel span,.day.sel i{color:#fff}
.mini{padding:10px 14px 6px;margin:0 0 12px}
.mini .cap{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:var(--mute)}
.mini .lg s{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;text-decoration:none}
.mini svg{width:100%;height:auto;display:block}
.mini .base{stroke:var(--line);stroke-width:1}
.mini .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
.mini .dot{fill:var(--line)}
.mini .dot.mid{fill:var(--cy)}
.mini .dot.hi{fill:var(--pink)}
.mini .ring{fill:none;stroke:var(--acc);stroke-width:2}
.mini text{font-size:8.5px;fill:var(--mute);text-anchor:middle}
.mini text.sel{fill:var(--acc);font-weight:800}
.mini [data-k]{cursor:pointer}
.panel h3{margin:0 0 8px;font-size:17px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
li button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);font-size:14px;margin:4px 0 12px}
.add{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:12px}
.add button{grid-column:1/-1}
.bars{display:flex;gap:3px;height:128px;margin-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--mute)}
.bar .track{flex:1;width:100%;display:flex;align-items:flex-end}
.bar .fill{display:block;width:100%;min-height:3px;border-radius:6px 6px 3px 3px;background:var(--line)}
.bar.mid .fill{background:var(--cy)}
.bar.hi .fill{background:var(--pink)}
.bar i{font-style:normal;font-size:9px;margin-top:4px}
.bar.sel i{color:var(--acc);font-weight:800}
.bar.sel .fill{box-shadow:0 0 0 2px var(--acc)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#modal{display:none;position:fixed;inset:0;background:rgba(18,16,43,.55);z-index:10;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#modal.open{display:flex}
#modal .box{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:480px}
#modal h3{margin:0 0 4px}
#modal select,#modal input{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#modal .btns{display:flex;gap:8px;margin-top:14px}
#modal .btns button{flex:1}
</style>
</head>
<body>
<main>
  <section class="panel mini">
    <div class="cap"><span>Gastos por dia</span><span class="lg"><s style="background:var(--cy)"></s>no limite<s style="background:var(--pink)"></s>acima</span></div>
    <div id="bars"></div>
  </section>

  <section class="top" id="top">
    <div class="thead"><small id="period"></small><button class="eye" id="eye" aria-label="Ocultar valores" aria-pressed="false"></button></div>
    <div class="hero">
      <div>
        <small id="plabel">Pode gastar hoje</small>
        <div class="big" id="perday">R$ 0,00</div>
        <small id="sub"></small>
      </div>
      <div class="ring"><svg viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="30" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/><circle id="rfg" cx="39" cy="39" r="30" fill="none" stroke="#27C4E8" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" style="transition:stroke-dashoffset .5s"/></svg><b id="rpct">0%</b></div>
    </div>
    <div class="row stats">
      <div><small>Orç. do período</small><b id="editb">R$ 0,00</b></div>
      <div><small>Gasto</small><b id="spent">R$ 0,00</b></div>
      <div><small>Restante</small><b id="left">R$ 0,00</b></div>
    </div>
    <div class="row accs">
      <div><small>Conta Aline</small><b id="vA">R$ 0,00</b></div>
      <div><small>Conta Cris</small><b id="vC">R$ 0,00</b></div>
      <div><small>Poupança</small><b id="vP">R$ 0,00</b></div>
      <button class="plus" id="plus" aria-label="Adicionar valor">+</button>
    </div>
  </section>

  <section class="cal">
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <h2 id="mtitle"></h2>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" style="margin:10px 4px 0">O contorno tracejado marca o dia 15, quando começa o 2º período.</p>
  </section>

  <section class="panel">
    <h3 id="dtitle"></h3>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nenhuma despesa neste dia.</p>
    <div class="add">
      <input id="desc" placeholder="Descrição (ex.: mercado)" aria-label="Descrição">
      <input id="val" type="number" inputmode="decimal" min="0" step="0.01" placeholder="R$" aria-label="Valor">
      <button class="p" id="addbtn">Adicionar despesa</button>
    </div>
  </section>
  <p class="empty" id="sync" style="text-align:center;margin:12px 0 0"></p>
  <p style="text-align:center;margin:4px 0 24px"><button class="edit" id="chcode" style="color:var(--mute);font-size:13px">Trocar código do casal</button>
    <button class="edit" id="chname" style="color:var(--mute);font-size:13px;margin-left:16px">Trocar meu nome</button></p>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-label="Adicionar valor">
  <div class="box">
    <h3>Adicionar valor</h3>
    <small id="mper" style="color:var(--mute)"></small>
    <select id="macc" aria-label="Conta"><option value="a">Conta Aline</option><option value="c">Conta Cris</option><option value="p">Poupança</option></select>
    <input id="mval" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Valor (R$)" aria-label="Valor">
    <div class="btns"><button class="p" id="mcancel" style="background:var(--line);color:var(--ink)">Cancelar</button><button class="p" id="msave">Salvar</button></div>
  </div>
</div>
<script type="module">
(function(){
var KEY="grana-casal-v1", data={budgets:{},exp:{},contas:{},contasF:{},poupD:""}, db=null;
function loadLocal(){try{var raw=localStorage.getItem(KEY); if(raw) data=JSON.parse(raw);}catch(e){}
if(!data.budgets) data.budgets={}; if(!data.exp) data.exp={}; if(!data.contas) data.contas={}; if(!data.contasF) data.contasF={};}
function save(){if(db)return;try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function fail(e){$("sync").textContent=(e&&e.code==="permission-denied")?"Sem permissão. Confira se as regras do Firestore foram publicadas.":"Não foi possível salvar. Tente de novo."}
var $=function(id){return document.getElementById(id)};
var money=function(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
var pad=function(n){return String(n).padStart(2,"0")};
var now=new Date(), view=new Date(now.getFullYear(),now.getMonth(),1);
var sel=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
var mkey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)};
function dayTotal(k){return (data.exp[k]||[]).reduce(function(s,e){return s+e.v},0)}
var SPLIT=15;
var SV='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
var EYE=SV+'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF=SV+'<path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.7 10.7 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
var hid=false;try{hid=localStorage.getItem("grana-oculto")==="1"}catch(e){}
function applyHide(){var b=$("eye");b.innerHTML=hid?EYEOFF:EYE;b.setAttribute("aria-label",hid?"Mostrar valores":"Ocultar valores");b.setAttribute("aria-pressed",hid?"true":"false");
  if(hid){$("rpct").textContent="•••";$("rfg").style.strokeDashoffset=188.5}
  if(hid)["perday","sub","editb","spent","left","vA","vC","vP"].forEach(function(id){var e=$(id);e.textContent=e.textContent.replace(/-?R\$[\s\u00a0]*[\d.,]+/g,"R$ •••")})}
function perOf(d){return d<SPLIT?1:2}
function bkey(y,m,p){return y+"-"+pad(m+1)+"-p"+p}
function acc(y,m,P,a){return a==="p"?data.contas["poup"]:data.contas[bkey(y,m,P)+"-"+a]}
function budgetOf(y,m,P){var A=acc(y,m,P,"a"),C=acc(y,m,P,"c");if(A===undefined&&C===undefined)return data.budgets[bkey(y,m,P)]||0;return (A||0)+(C||0)}
function curB(){return bkey(view.getFullYear(),view.getMonth(),perOf(+sel.slice(-2)))}
function startOf(y,m,P,a){var k=bkey(y,m,P),f=[data.contasF[k+"-a"],data.contasF[k+"-c"]].filter(function(x){return typeof x==="number"});return f.length?Math.max(a,Math.min.apply(null,f)):a}
function calc(y,m,P){var dim=new Date(y,m+1,0).getDate(),a=P===1?1:SPLIT,z=P===1?SPLIT-1:dim,S=startOf(y,m,P,a),len=z-S+1,b=budgetOf(y,m,P),A=b/len,carry=0,out={},tot=0;
  for(var d=a;d<=z;d++){var k=y+"-"+pad(m+1)+"-"+pad(d),sp=dayTotal(k);
    if(d<S){out[d]={off:true,carry:0,sp:sp};continue}
    var av=A-carry,bal=av-sp;out[d]={carry:carry,sp:sp,bal:bal};carry=-bal;tot+=sp}
  return {A:A,days:out,a:a,z:z,b:b,S:S,spent:tot}}
function todayKey(){var n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())}
function savings(){var base=data.contas["poup"],ex=base!==undefined,anc=ex?(data.poupD||"9999-99-99"):"",tk=todayKey(),add=0,seen={};
  for(var id in data.contas){var mm=id.match(/^(\d{4})-(\d{2})-p([12])-[ac]$/);if(!mm)continue;var pk=mm[1]+mm[2]+mm[3];if(seen[pk])continue;seen[pk]=1;
    var y=+mm[1],m=+mm[2]-1,P=+mm[3],dim=new Date(y,m+1,0).getDate(),z=P===1?SPLIT-1:dim,endK=mm[1]+"-"+mm[2]+"-"+pad(z);
    if(endK<tk&&endK>=anc){var r=calc(y,m,P),left=r.b-r.spent;if(left>0)add+=left}}
  return (base||0)+add}
function periodSpent(y,m,p){var pre=y+"-"+pad(m+1)+"-",t=0;for(var k in data.exp){if(k.indexOf(pre)===0&&perOf(+k.slice(-2))===p)t+=dayTotal(k)}return t}

function render(){
  var y=view.getFullYear(), m=view.getMonth(), dim=new Date(y,m+1,0).getDate();
  var sd=+sel.slice(-2), P=perOf(sd);
  var R=[null,calc(y,m,1),calc(y,m,2)], r=R[P], a=r.a, z=r.z, b=r.b, sp=r.spent, left=b-sp, info=r.days[sd];
  var cur=(y===now.getFullYear()&&m===now.getMonth());
  var isToday=cur&&sd===now.getDate();
  $("period").textContent=(P===1?"1º período":"2º período")+": dia "+a+" ao dia "+z;
  $("plabel").textContent=isToday?"Pode gastar hoje":"Saldo do dia "+sd;
  var off=!!info.off;
  $("perday").textContent=off?"—":money(info.bal);
  $("sub").textContent=off?"O orçamento começa no dia "+r.S:"Limite do dia "+money(r.A)+(info.carry<0?" + sobra de "+money(-info.carry):info.carry>0?" - descontado de "+money(info.carry):"");
  $("editb").textContent=off?"—":money(b);
  $("vA").textContent=off?"—":money(acc(y,m,P,"a")||0);$("vC").textContent=off?"—":money(acc(y,m,P,"c")||0);$("vP").textContent=money(savings());
  var pct=!off&&b>0?Math.min(100,Math.max(0,Math.round(sp/b*100))):0;$("rfg").style.strokeDashoffset=188.5*(1-pct/100);$("rpct").textContent=pct+"%";
  $("spent").textContent=off?"—":money(sp);
  $("left").textContent=off?"—":money(left);
  $("top").className="top"+(!off&&info.bal<0?" bad":"");
  applyHide();
  $("mtitle").textContent=view.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  var g=$("grid"); g.innerHTML="";
  ["D","S","T","Q","Q","S","S"].forEach(function(d){var e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e)});
  var first=new Date(y,m,1).getDay();
  for(var i=0;i<first;i++) g.appendChild(document.createElement("div"));
  for(var d=1;d<=dim;d++){
    var k=y+"-"+pad(m+1)+"-"+pad(d), t=dayTotal(k);
    var btn=document.createElement("button");
    btn.className="day"+(d===SPLIT?" split":"")+(t>0?" has":"")+(R[perOf(d)].days[d].bal<0?" over":"")+(cur&&d===now.getDate()?" today":"")+(k===sel?" sel":"");
    btn.innerHTML="<span>"+d+"</span><i>"+(t>0?Math.round(t):"")+"</i>";
    btn.setAttribute("aria-label","Dia "+d+(t>0?", gasto "+money(t):""));
    btn.onclick=(function(kk){return function(){sel=kk;render()}})(k);
    g.appendChild(btn);
  }
  renderBars(r,y,m,a,z);renderDay();
}
function renderBars(r,y,m,a,z){var el=$("bars"),n=z-a+1,W=320,H=44,px=12,py=8,mx=0,i,pts=[];
  for(i=a;i<=z;i++)mx=Math.max(mx,r.days[i].sp);
  for(i=a;i<=z;i++){var t=r.days[i].sp;pts.push({d:i,t:t,x:px+(n>1?(i-a)*(W-2*px)/(n-1):W/2),y:H-py-(mx>0?t/mx*(H-2*py):0),k:y+"-"+pad(m+1)+"-"+pad(i),off:!!r.days[i].off})}
  var h='<svg viewBox="0 0 '+W+' '+(H+14)+'" role="img" aria-label="Gastos por dia no período"><line class="base" x1="'+px+'" y1="'+(H-py)+'" x2="'+(W-px)+'" y2="'+(H-py)+'"/><polyline class="ln" points="'+pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1)}).join(" ")+'"/>';
  pts.forEach(function(p){var c=p.t>0?(!p.off&&r.A>0&&p.t>r.A?"hi":"mid"):"",sl=p.k===sel,cx=p.x.toFixed(1),cy=p.y.toFixed(1);
    h+='<circle class="dot '+c+'" cx="'+cx+'" cy="'+cy+'" r="'+(sl?4.5:3)+'"/>';
    if(sl)h+='<circle class="ring" cx="'+cx+'" cy="'+cy+'" r="8"/>';
    h+='<text class="'+(sl?"sel":"")+'" x="'+cx+'" y="'+(H+10)+'">'+p.d+'</text>';
    h+='<circle data-k="'+p.k+'" cx="'+cx+'" cy="'+cy+'" r="9" fill="transparent"/>'});
  el.innerHTML=h+"</svg>";
  var hs=el.querySelectorAll("[data-k]");for(i=0;i<hs.length;i++)hs[i].onclick=function(){sel=this.getAttribute("data-k");render()}}
function renderDay(){
  var p=sel.split("-"), dt=new Date(+p[0],+p[1]-1,+p[2]);
  var items=data.exp[sel]||[], tot=dayTotal(sel);
  $("dtitle").textContent=dt.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})+(tot>0?" — "+money(tot):"");
  var ul=$("list"); ul.innerHTML="";
  items.forEach(function(e,idx){
    var li=document.createElement("li");
    var s=document.createElement("span"); s.textContent=e.d;
    if(e.by){var nm=document.createElement("small");nm.textContent="  "+e.by;nm.style.color="var(--mute)";s.appendChild(nm)}
    var r=document.createElement("span"); r.textContent=money(e.v);
    var x=document.createElement("button"); x.textContent="×"; x.setAttribute("aria-label","Apagar "+e.d);
    x.onclick=function(){
      if(db){db.doc("despesas/"+e.id).delete().catch(fail);return}
      items.splice(idx,1); if(!items.length) delete data.exp[sel]; save(); render()};
    li.appendChild(s); li.appendChild(r); li.appendChild(x); ul.appendChild(li);
  });
  $("empty").hidden=items.length>0;
}
function go(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);var c=(view.getFullYear()===now.getFullYear()&&view.getMonth()===now.getMonth());sel=mkey(view)+"-"+pad(c?now.getDate():1);render()}
$("prev").onclick=function(){go(-1)};
$("next").onclick=function(){go(1)};
var perTxt="";
function fillM(){var a=$("macc").value;$("mper").textContent=a==="p"?"Total guardado. As sobras dos períodos encerrados entram sozinhas.":perTxt+". Vale a partir do dia "+(+sel.slice(-2))+".";
  var v=a==="p"?Math.round(savings()*100)/100:acc(view.getFullYear(),view.getMonth(),perOf(+sel.slice(-2)),a);$("mval").value=v===undefined?"":v}
function openModal(){var P=perOf(+sel.slice(-2)),dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  perTxt=(P===1?"1º período (dia 1 ao "+(SPLIT-1)+")":"2º período (dia "+SPLIT+" ao "+dim+")")+" de "+view.toLocaleDateString("pt-BR",{month:"long"});
  fillM();$("modal").className="open";$("mval").focus()}
$("plus").onclick=openModal;
$("eye").onclick=function(){hid=!hid;try{localStorage.setItem("grana-oculto",hid?"1":"0")}catch(e){}render()};
$("macc").onchange=fillM;
$("mcancel").onclick=function(){$("modal").className=""};
$("modal").onclick=function(e){if(e.target===this)this.className=""};
$("msave").onclick=function(){var v=parseFloat($("mval").value);if(isNaN(v)||v<0){$("mval").focus();return}
  var a=$("macc").value,key=a==="p"?"poup":curB()+"-"+a,o={v:v};$("modal").className="";
  if(a==="p")o.d=todayKey();
  else{o.f=+sel.slice(-2)}
  if(db){db.doc("contas/"+key).set(o).catch(fail);return}
  data.contas[key]=v;if(o.f!==undefined)data.contasF[key]=o.f;if(a==="p")data.poupD=o.d;save();render()};
$("addbtn").onclick=function(){
  var v=parseFloat($("val").value), d=$("desc").value.trim()||"Despesa";
  if(isNaN(v)||v<=0){$("val").focus();return}
  $("desc").value="";$("val").value="";
  var who=getName(false);
  if(db){db.collection("despesas").add({k:sel,d:d,v:v,by:who,t:Date.now()}).catch(fail);return}
  (data.exp[sel]=data.exp[sel]||[]).push({d:d,v:v,by:who});save();render();
};
function subscribe(d){
  db=d; data={budgets:{},exp:{},contas:{},contasF:{},poupD:""};
  $("sync").textContent="Sincronizado: vocês dois veem os mesmos dados.";
  d.collection("orcamentos").onSnapshot(function(s){var b={};s.docs.forEach(function(x){var o=x.data();b[x.id]=(o&&o.v)||0});data.budgets=b;render()},fail);
  d.collection("despesas").onSnapshot(function(s){var e={};s.docs.forEach(function(x){var o=x.data();if(!o||!o.k)return;(e[o.k]=e[o.k]||[]).push({id:x.id,d:o.d,v:o.v,by:o.by||"",t:o.t||0})});for(var k in e)e[k].sort(function(a,b){return a.t-b.t});data.exp=e;render()},fail);
  d.collection("contas").onSnapshot(function(sn){var c={},f={},pd="";sn.docs.forEach(function(x){var o=x.data()||{};c[x.id]=o.v||0;if(typeof o.f==="number")f[x.id]=o.f;if(x.id==="poup")pd=o.d||""});data.contas=c;data.contasF=f;data.poupD=pd;render()},fail);
  render();
}
function local(){loadLocal();$("sync").textContent="Modo local: os dados ficam só neste aparelho.";render()}
var NK="grana-nome";
function getName(force){var n="";try{n=localStorage.getItem(NK)||""}catch(e){}
  if(force||!n){var x=prompt("Seu nome (aparece nos lançamentos):",n);if(x&&x.trim()){n=x.trim().slice(0,20);try{localStorage.setItem(NK,n)}catch(e){}}}
  return n}
var CK="grana-codigo";
function getCode(force){var c="";try{c=localStorage.getItem(CK)||""}catch(e){}
  if(force||c.length<8){var x=prompt("Código do casal: invente uma frase longa (letras e números, mínimo 8). Use o MESMO código nos dois celulares.",c);
    if(x){x=x.toLowerCase().replace(/[^a-z0-9_-]/g,"");if(x.length>=8){c=x;try{localStorage.setItem(CK,c)}catch(e){}}}}
  return c}
var collection,doc,addDoc,setDoc,deleteDoc,onSnapshot;
function mkDb(fs,base){return{
  collection:function(n){var c=collection(fs,base+"/"+n);return{add:function(o){return addDoc(c,o)},onSnapshot:function(cb,er){return onSnapshot(c,cb,er)}}},
  doc:function(p){var q=p.split("/");var r=doc(fs,base+"/"+q[0],q[1]);return{delete:function(){return deleteDoc(r)},set:function(o){return setDoc(r,o)}}}}}
$("chcode").onclick=function(){if(getCode(true).length>=8)location.reload()};
$("chname").onclick=function(){getName(true)};
(function start(){
  var c=getCode(false);
  if(c.length<8){local();return}
  getName(false);
  var B="https://www.gstatic.com/firebasejs/10.14.1/";
  Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore.js")]).then(function(m){
    var f=m[1];collection=f.collection;doc=f.doc;addDoc=f.addDoc;setDoc=f.setDoc;deleteDoc=f.deleteDoc;onSnapshot=f.onSnapshot;
    var app=m[0].initializeApp({apiKey:"AIzaSyAho6OYuMxJfRQQsAm9daJqlt9BHvkxNiU",authDomain:"grana-casal.firebaseapp.com",projectId:"grana-casal",storageBucket:"grana-casal.firebasestorage.app",messagingSenderId:"89489454785",appId:"1:89489454785:web:e5d42b5eccd2d9615e8640"});
    subscribe(mkDb(f.getFirestore(app),"casais/"+c));
  }).catch(function(){local()});
})();
render();
})();
</script>
