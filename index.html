:root[data-theme="dark"][data-pal="areia"]{--bg:#161B17;--card:#202823;--ink:#EAF1EA;--mute:#9AA89B;--line:#323D35;--acc:#86CFA2;--accbg:#25382C;--pinkbg:#3A2822;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px 16px 8px}
.top{position:relative;color:#fff;border-radius:28px;padding:16px 18px 16px;background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%);box-shadow:0 14px 34px var(--gsh)}
.top.bad{background:linear-gradient(135deg,var(--b1) 0%,var(--b2) 100%)}
.top small{opacity:.8;font-size:13px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eye{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.big{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;margin:2px 0 4px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.row{display:flex;gap:12px;justify-content:space-between;font-size:13px}
.row b{display:block;font-size:16px}
.stats{padding:12px 0;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.accs{margin-top:12px;gap:8px;align-items:stretch}
.accs>div{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 10px}
.accs small{font-size:11px}
.accs b{font-size:14px}
.plus{width:48px;border-radius:16px;border:0;background:#fff;color:var(--g1);font-size:26px;font-weight:700;cursor:pointer;flex:none}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;max-width:100%}
button.p{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;cursor:pointer}
.edit{background:none;border:0;font:inherit;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.cal,.panel{background:var(--card);border-radius:24px;padding:16px;margin-top:16px;box-shadow:var(--sh)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px}
.nav h2{margin:0;font-size:18px;text-transform:capitalize}
.nav button{background:var(--accbg);border:0;color:var(--acc);border-radius:12px;width:40px;height:40px;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;font-weight:600;color:var(--mute);text-align:center;padding:2px 0}
.day{aspect-ratio:1/1.08;border:2px solid transparent;border-radius:14px;background:none;color:var(--ink);font:inherit;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}
.day span{font-size:14px;font-weight:600}
.day i{font-style:normal;font-size:9px;color:var(--mute);min-height:11px}
.day.has{background:var(--accbg)}
.day.has i{color:var(--acc);font-weight:700}
.day.over{background:var(--pinkbg)}
.day.over i{color:var(--pink);font-weight:700}
.day.split{border:2px dashed var(--cy)}
.day.today{border:2px solid var(--acc)}
.day.sel{background:var(--acc);border-color:var(--acc)}
.day.sel span,.day.sel i{color:#fff}
.pals{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin:0 0 24px}
.pals button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.pals button.on{border-color:var(--ink)}
.pie{display:flex;justify-content:center;margin:6px 0 10px}
.pie svg{width:190px;height:190px}
.plegend li{gap:8px}
.plegend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plegend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.plegend span{font-size:14px}
.plegend b{font-size:13px;min-width:54px;text-align:right}
.mini{padding:10px 14px 6px;margin:0 0 12px}
.mini .cap{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:var(--mute)}
.mini .lg s{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;text-decoration:none}
.mini svg{width:100%;height:auto;display:block}
.mini .base{stroke:var(--line);stroke-width:1}
.mini .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
.mini .dot{fill:var(--line)}
.mini .dot.mid{fill:var(--cy)}
.mini .dot.hi{fill:var(--pink)}
.mini .ring{fill:none;stroke:var(--acc);stroke-width:2}
.mini text{font-size:8.5px;fill:var(--mute);text-anchor:middle}
.mini text.sel{fill:var(--acc);font-weight:800}
.mini [data-k]{cursor:pointer}
.panel h3{margin:0 0 8px;font-size:17px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
#list li>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
#list li .amt{font-weight:700;white-space:nowrap;text-align:right}
#list li small{margin-left:6px;color:var(--mute);font-size:12px}
li button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);font-size:14px;margin:4px 0 12px}
.add{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;margin-top:12px}
.add input{width:100%;min-width:0}
.add button{grid-column:1/-1}
.bars{display:flex;gap:3px;height:128px;margin-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--mute)}
.bar .track{flex:1;width:100%;display:flex;align-items:flex-end}
.bar .fill{display:block;width:100%;min-height:3px;border-radius:6px 6px 3px 3px;background:var(--line)}
.bar.mid .fill{background:var(--cy)}
.bar.hi .fill{background:var(--pink)}
.bar i{font-style:normal;font-size:9px;margin-top:4px}
.bar.sel i{color:var(--acc);font-weight:800}
.bar.sel .fill{box-shadow:0 0 0 2px var(--acc)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#modal{display:none;position:fixed;inset:0;background:rgba(18,16,43,.55);z-index:10;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#modal.open{display:flex}
#modal .box{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:480px}
#modal h3{margin:0 0 4px}
#modal select,#modal input{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#modal .btns{display:flex;gap:8px;margin-top:14px}
#modal .btns button{flex:1}
</style>
<style>.accs,.pals{display:none!important}#modal{display:none!important}.stats{border-bottom:0!important;padding-bottom:0!important}</style>
<style>.pseg{display:inline-flex;background:var(--accbg);border-radius:14px;padding:2px;margin-left:8px;vertical-align:middle}.pseg button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:4px 12px;border-radius:12px;cursor:pointer}.pseg button.on{background:var(--acc);color:#fff}</style>
</head>
<body>
<main>
  <section class="panel mini">
    <div class="cap"><span>Gastos por dia</span><span class="lg"><s style="background:var(--cy)"></s>no limite<s style="background:var(--pink)"></s>acima</span></div>
    <div id="bars"></div>
  </section>

  <section class="top" id="top">
    <div class="thead"><small id="period"></small><button class="eye" id="eye" aria-label="Ocultar valores" aria-pressed="false"></button></div>
    <div class="hero">
      <div>
        <small id="plabel">Pode gastar hoje</small>
        <div class="big" id="perday">R$ 0,00</div>
        <small id="sub"></small>
      </div>
      <div class="ring"><svg viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="30" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/><circle id="rfg" cx="39" cy="39" r="30" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" style="stroke:var(--ring);transition:stroke-dashoffset .5s"/></svg><b id="rpct">0%</b></div>
    </div>
    <div class="row stats">
      <div><small>Orç. do período</small><b id="editb">R$ 0,00</b></div>
      <div><small>Gasto</small><b id="spent">R$ 0,00</b></div>
      <div><small>Restante</small><b id="left">R$ 0,00</b></div>
    </div>
    <div class="row accs">
      <div><small>Conta Aline</small><b id="vA">R$ 0,00</b></div>
      <div><small>Conta Cris</small><b id="vC">R$ 0,00</b></div>
      <div><small>Poupança</small><b id="vP">R$ 0,00</b></div>
      <button class="plus" id="plus" aria-label="Adicionar valor">+</button>
    </div>
  </section>

  <section class="cal">
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <h2 id="mtitle"></h2>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <h3 id="dtitle"></h3>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nenhuma despesa neste dia.</p>
    <div class="add">
      <input id="desc" placeholder="Descrição (ex.: mercado)" aria-label="Descrição">
      <input id="val" type="number" inputmode="decimal" min="0" step="0.01" placeholder="R$" aria-label="Valor">
      <button class="p" id="addbtn">Adicionar despesa</button>
    </div>
  </section>
  <section class="panel">
    <h3>Despesas por descrição</h3><div class="pseg"><button id="pdia" type="button">Diário</button><button id="pmes" type="button" class="on">Mensal</button></div>
    <div class="pie" id="pie"></div>
    <ul class="plegend" id="pleg"></ul>
    <p class="empty" id="pnote"></p>
  </section>
  <p class="empty" id="sync" style="text-align:center;margin:12px 0 0"></p>
  <p style="text-align:center;margin:4px 0 24px"><button class="edit" id="chcode" style="color:var(--mute);font-size:13px">Trocar código do casal</button>
    <button class="edit" id="chname" style="color:var(--mute);font-size:13px;margin-left:16px">Trocar meu nome</button></p>
  <div class="pals"><span>Cores</span>
    <button data-pal-btn="oceano" aria-label="Paleta Oceano" style="background:linear-gradient(135deg,#16707A,#35B0A2)"></button>
    <button data-pal-btn="indigo" aria-label="Paleta Índigo" style="background:linear-gradient(135deg,#4638B5,#7A63E6)"></button>
    <button data-pal-btn="areia" aria-label="Paleta Floresta" style="background:linear-gradient(135deg,#2E6B4E,#58A27C)"></button>
  </div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-label="Adicionar valor">
  <div class="box">
    <h3>Adicionar valor</h3>
    <small id="mper" style="color:var(--mute)"></small>
    <select id="macc" aria-label="Conta"><option value="a">Conta Aline</option><option value="c">Conta Cris</option><option value="p">Poupança</option></select>
    <input id="mval" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Valor (R$)" aria-label="Valor">
    <div class="btns"><button class="p" id="mcancel" style="background:var(--line);color:var(--ink)">Cancelar</button><button class="p" id="msave">Salvar</button></div>
  </div>
</div>
<script type="module">

  if(hid){$("rpct").textContent="•••";$("rfg").style.strokeDashoffset=188.5}

function todayKey(){var n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())}

  renderBars(r,y,m,a,z);renderPie(r,y,m);renderDay();try{parent.postMessage({grana:1,exp:data.exp},"*")}catch(e){}

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var PCOL=["var(--acc)","var(--cy)","var(--pink)","#F2B84B","#8E7CC3","#5DB87F","#E08FB5","#6FA8DC"];
